name: ci

on: [push, pull_request]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar Godot 4.3-stable
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Importar projeto (headless)
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import

      - name: Testes do nucleo (/core)
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tools/run_tests.gd
